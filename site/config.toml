# il dns reale serve l'apex: www.roccatello.it fa 301 verso roccatello.it,
# quindi canonical e sitemap devono puntare all'apex
baseurl = "https://roccatello.it/"
title = "Eduard Roccatello"
copyright = "&copy; 2025"

theme = "eduard-v3"
enableEmoji = true
footnotereturnlinkcontents = "<sup>^</sup>"
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$"]
enableRobotsTXT = true

# niente pagine /tags e /categories. i tag restano nel front matter e
# continuano ad alimentare i post correlati, ma non generano pagine
disableKinds = ["taxonomy", "term"]

# node_modules sta nella radice del repo, fuori dal progetto hugo. va montato
# dentro assets, altrimenti scss e javascript non risolvono gli import.
# dichiarando un mount per assets si perde quello di default, quindi va rimesso
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../node_modules"
    target = "assets/node_modules"

# Enable comments by entering your Disqus shortname
disqusShortname = ""

defaultContentLanguage = "it"
languageCode = "it-IT"
# gli url restano senza prefisso di lingua: nessun redirect da sistemare
defaultContentLanguageInSubdir = false

# senza questo blocco hugo tiene "en" come chiave di lingua anche impostando
# defaultContentLanguage, e le pagine escono con lang="en"
[languages]
  [languages.it]
    label = "Italiano"
    locale = "it-IT"
    weight = 1

# Get last modified date for content from Git?
enableGitInfo = false

[outputs]
  home = [ "HTML", "RSS" ]
  section = [ "HTML", "RSS" ]

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = true
      keepWhitespace = false

[blackfriday]
  hrefTargetBlank = true
  fractions = true
  smartypants = true

[permalinks]
  'post' = '/:year/:month/:slug/'

[pagination]
  pagerSize = 10

[params]
  name = "Eduard Roccatello"
  role = ""

  # usato solo nel tag <title> della home: il navbar mostra Site.Title
  home_title = "Eduard Roccatello — dati territoriali, LIDAR e modelli urbani 3D"
  organizations = [ { name = "3DGIS Chief Technical Officer", url = "https://www.3dgis.it" } ]

  gravatar = false  # Get your avatar from Gravatar.com? (true/false)
  avatar = "avatar.png"  # Specify an avatar image (in `static/img/` folder) or delete value to disable avatar.
  
  address = "Bergamo. Rovigo. Padova."

  map = 0
  map_api_key = ""
  latitude = "45.050801"
  longitude = "11.780133"
  zoom = 6

  # Description for social sharing and search engines. If undefined, author role is used in place.
  description = "Ricerca e sviluppo su dati territoriali: rilievo LIDAR, modelli urbani tridimensionali, banche dati spaziali. Note tecniche e appunti di lavoro di Eduard Roccatello, fondatore e CTO di 3DGIS."
  sharing_image = "avatar.png"
  twitter = "edurocc"
  date_format = "2006-01-02"
  time_format = "15:04"

  # Show estimated reading time for posts?
  reading_time = true

  # Display comment count? Requires commenting to be enabled.
  comment_count = false

  # Display next/previous section pager?
  section_pager = true

  # Enable global LaTeX math rendering?
  #   If false, you can enable it locally on a per page basis.
  math = false

  highlight = true
  highlight_languages = []
  highlight_style = "github"

  sharing = true
  privacy_pack = true

  custom_css = []
  custom_js  = []

  publication_types = [
    'Uncategorized',  # 0
    'Conference paper',  # 1
    'Journal article',  # 2
    'Manuscript',  # 3
    'Report',  # 4
    'Book',  # 5
    'Book section'  # 6
  ]

  # Configuration of talk pages.
  [params.talks]
    # Show talk time?
    time = true

  # Configuration of publication pages.
  [params.publications]
    # Date format (refer to https://sourcethemes.com/academic/docs/customization/#date-format )
    #   Examples: "Mon, Jan 2, 2006" or "2006-01-02"
    date_format = "January, 2006"

  # Configuration of project pages.
  [params.projects]
    # List publications and talks related to the project?
    list_children = true
    publication_format = 3

  [[params.social]]
    icon = "envelope"
    icon_pack = "fas"
    link = "mailto:eduard.roccatello@3dgis.it"
    text = "eduard.roccatello@3dgis.it"

  [[params.social]]
    icon = "linkedin"
    icon_pack = "fab"
    link = "https://www.linkedin.com/in/roccatello/"
    text = "linkedin.com/in/roccatello"

  [[params.social]]
    icon = "github"
    icon_pack = "fab"
    link = "//github.com/mastershadow"
    text = "github.com/mastershadow"

  [[params.social]]
    icon = "mastodon"
    icon_pack = "fab"
    link = "https://mas.to/@mastershadow"
    text = "@mastershadow@mas.to"

[[menu.main]]
  name = "Articoli"
  url = "post"
  weight = 2

[[menu.main]]
