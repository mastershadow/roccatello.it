  url = "#mondogis"
  weight = 3

[[menu.main]]
  name = "Chi sono"
  url = "#aboutme"
  weight = 4

[[menu.main]]
  name = "Progetti"
  url = "#showcase"
  weight = 6

[[menu.main]]
  name = "Contatti"
  url = "#contacts"
  weight = 8

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
