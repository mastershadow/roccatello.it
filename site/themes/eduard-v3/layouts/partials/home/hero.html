{{ $ := .root }}
{{ $page := .page }}
{{/* fascia navy che continua la navbar: e' il lockup del logo, bianco su blu */}}
<section id="hero" class="hero-band text-light">
  <div class="container pt-5 pb-5">
    <h1 class="display-4">{{ $page.Title }}</h1>
    <p class="fs-3 text-white-50 mb-4">{{ $page.Params.subtitle }}</p>
    <div class="fs-5 col-lg-8 p-0">{{ $page.Content }}</div>
  </div>
</section>
